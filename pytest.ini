[pytest]
pythonpath = .
testpaths = tests

#¿Por qué se hace? Le indica a pytest dónde está la raíz del código (pythonpath = .) y dónde buscar los tests (testpaths = tests).
#¿Por qué así? Es la forma limpia y estándar de solucionar los errores de importación (from domain..., from application...) sin tener que modificar sys.path a mano en cada archivo.